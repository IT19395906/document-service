server.port=8152
app.security.enabled=false
spring.cloud.consul.enabled=false
spring.cloud.discovery.enabled=false
spring.datasource.url=jdbc:h2:mem:portfolio_document_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
font.path=src/main/resources/fonts/Lato-Regular.ttf
font.receipt.path=src/main/resources/fonts/Lato-Medium.ttf
custom.font.path.bold=src/main/resources/fonts/Lato-Bold.ttf
custom.font.path.regular=src/main/resources/fonts/Lato-Medium.ttf